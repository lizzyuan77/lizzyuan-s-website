<div class="explorer" id="museum-explorer"><div class="explorer-controls"><label for="city-choice">City<select id="city-choice"><option value="all">All eight cities</option><option>Boston</option><option>Chicago</option><option>Houston</option><option>Los Angeles</option><option>New York</option><option>Philadelphia</option><option>San Francisco</option><option>Washington DC</option></select></label><label for="age-choice">Same age in both groups<select id="age-choice"><option value="30">Age 30 · baseline</option><option value="22">Age 22 · youth eligibility</option></select></label></div><p class="explorer-summary" id="explorer-summary" aria-live="polite"></p><div class="table-scroll" tabindex="0" role="region" aria-label="Museum admission prices; scroll horizontally on a small screen"><table><thead><tr><th scope="col">Museum / official source</th><th scope="col">Adult</th><th scope="col">Student</th><th scope="col">Saving</th><th scope="col">Conditions & planning notes</th></tr></thead><tbody>__ROWS__</tbody></table></div><small>Fixed = posted regular price. Suggested = MCA online price, with pay-what-you-can onsite. Free = both comparison groups enter free.</small></div>
<script>
(()=>{const city=document.getElementById('city-choice'),age=document.getElementById('age-choice');const rows=[...document.querySelectorAll('#museum-explorer tbody tr')];function update(){let n=0,s=0,c=0;for(const r of rows){r.hidden=city.value!=='all'&&r.dataset.city!==city.value;const a=Number(age.value==='22'?r.dataset.adult22:r.dataset.adult),b=Number(age.value==='22'?r.dataset.student22:r.dataset.student);r.querySelector('.adult').textContent='$'+a.toFixed(2);r.querySelector('.student').textContent='$'+b.toFixed(2);r.querySelector('.saving').textContent='$'+(a-b).toFixed(2);if(!r.hidden){n++;s+=a-b;c+=b;}}document.getElementById('explorer-summary').textContent=n+' sampled museums · mean student price $'+(c/n).toFixed(2)+' · mean student-ID saving $'+(s/n).toFixed(2)+' per museum';}city.addEventListener('change',update);age.addEventListener('change',update);update();})();
</script>
